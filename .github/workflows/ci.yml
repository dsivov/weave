# CI — the guards run on every commit, because left to humans they decay in a phase.
#
# Three things are checked here and each one is a constraint, not a preference:
#   · the rebrand holds                        (A3, R3)
#   · the Python suite is green                (R5)
#   · the UI suite is green                    (A11 — one test runner per language)
#
# The source-tree assertion (A2/D-003) is deliberately NOT here: it needs the
# read-only source checkout, which exists on the machine the fork was taken on and
# nowhere else. It runs there, via `scripts/parent_checksum.sh verify`, and its
# result is recorded at each milestone review.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nameguard:
    name: name-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The rebrand is enforced, not remembered
        run: bash scripts/nameguard.sh

  python:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}          # -l so the conda hook is loaded
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: weave
          auto-activate-base: false
      - name: Install the packages without touching the manifest
        run: pip install -e . --no-deps
      - name: pytest
        run: pytest -q

  ui:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: weave-ui
        run: bun install --frozen-lockfile || bun install
      - name: Lint
        working-directory: weave-ui
        run: bun run lint

      # The carried UI ships no test files, and P0 does not invent any: its gate
      # is "the same tests, at the same count" (R5), so writing new ones here
      # would make the comparison meaningless. `bun test` exits non-zero when it
      # matches nothing, so an empty suite is reported rather than dressed up as
      # a pass — and it stops being empty the moment P1 adds the Admin screens.
      - name: bun test
        working-directory: weave-ui
        run: |
          if bun test 2>&1 | tee /tmp/bun-test.log; then
            echo "UI suite green."
          elif grep -q "0 test files matching" /tmp/bun-test.log; then
            echo "::warning::The UI carries no tests yet (P0 parity). First ones land in P1."
          else
            echo "::error::UI suite failed." && exit 1
          fi

      - name: The UI must build — the server serves it as static assets (A1)
        working-directory: weave-ui
        run: bun run build
