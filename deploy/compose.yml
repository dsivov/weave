# Weave — the server and its database (P1).
#
# Deployable #1 of three (A1): the Weave server, which also serves the built UI
# as static assets. The dev-host daemon and the dev-agent image are separate and
# land in P6 (`deploy/compose.devhost.yml`, `deploy/dev-agent.Dockerfile`) —
# a dev host is deployed *per developer machine*, often behind NAT, and is not
# part of the hub's compose file (A15).
#
#   docker compose -f deploy/compose.yml up -d
#
# Neo4j is optional and off by default. Bring it up only if you want the
# dedicated graph engine:
#
#   docker compose -f deploy/compose.yml --profile neo4j up -d
#
# EVERY VARIABLE WEAVE READS IS `WEAVE_`-PREFIXED (D-024). The ones without a
# prefix below belong to the database images themselves, and prefixing those
# would simply break them.

name: weave

services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    ports:
      # 0.0.0.0 so the server is reachable from another machine — a human role
      # runs Claude Code against `<server>/mcp` from wherever they work (A10, R53).
      - "0.0.0.0:${WEAVE_PORT:-9800}:9800"
    environment:
      # These two stay literal on purpose: they describe the *inside* of the
      # container, not a preference. The server must bind all interfaces for the
      # port mapping above to reach it, and 9800 is the container side of that
      # mapping — changing either here breaks the published port rather than
      # moving it. Use `WEAVE_PORT` on the `ports:` line to move it.
      WEAVE_HOST: "0.0.0.0"
      WEAVE_PORT: "9800"

      # THE SIGNING SECRET IS REQUIRED AND HAS NO DEFAULT HERE, DELIBERATELY.
      # Every token carries the role RBAC enforces against, so a shipped default
      # would be an open door in every deployment that copied this file. The
      # server refuses to start without one (S1). Generate with:
      #     python -c "import secrets; print(secrets.token_urlsafe(48))"
      WEAVE_TOKEN_SECRET: "${WEAVE_TOKEN_SECRET:?set WEAVE_TOKEN_SECRET — the server will not start on the default}"

      # The multi-user production path (D-007). File-based storage is the
      # zero-install default for a single operator; it is the wrong choice here,
      # because its writes are whole-file read-modify-write and concurrent
      # writers lose each other's work (A4, R10).
      #
      # Overridable, and that is not cosmetic (W20). When the server refuses to
      # start it tells the operator to set `WEAVE_VECTOR_STORAGE` or
      # `WEAVE_ENABLE_QUADRUPLE` — and as literals those exports did nothing, so
      # the advice was a dead end and the only way out was editing this file.
      # A refusal you can act on beats one you have to edit around.
      WEAVE_KV_STORAGE: "${WEAVE_KV_STORAGE:-PGKVStorage}"
      WEAVE_VECTOR_STORAGE: "${WEAVE_VECTOR_STORAGE:-PGVectorStorage}"
      WEAVE_GRAPH_STORAGE: "${WEAVE_GRAPH_STORAGE:-PGGraphStorage}"
      WEAVE_DOC_STATUS_STORAGE: "${WEAVE_DOC_STATUS_STORAGE:-PGDocStatusStorage}"

      # Also literal, and also about the inside: `postgres` is the compose
      # service name on this network, and 5432 is where that image listens.
      # Overriding them points the server at a database this file did not start.
      WEAVE_POSTGRES_HOST: postgres
      WEAVE_POSTGRES_PORT: "5432"
      WEAVE_POSTGRES_USER: "${WEAVE_POSTGRES_USER:-weave}"
      WEAVE_POSTGRES_PASSWORD: "${WEAVE_POSTGRES_PASSWORD:?set WEAVE_POSTGRES_PASSWORD}"
      WEAVE_POSTGRES_DATABASE: "${WEAVE_POSTGRES_DATABASE:-weave}"

      # The server's own model backend — metered, repointable, and the ONLY
      # place in this system a model credential exists (A13). No Claude Code
      # seat, human or agent, ever sees one.
      WEAVE_LLM_BINDING: "${WEAVE_LLM_BINDING:-openai}"
      WEAVE_LLM_MODEL: "${WEAVE_LLM_MODEL:-gpt-4o-mini}"
      WEAVE_EMBEDDING_BINDING: "${WEAVE_EMBEDDING_BINDING:-openai}"
      WEAVE_EMBEDDING_MODEL: "${WEAVE_EMBEDDING_MODEL:-text-embedding-3-small}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"   # read by the vendor SDK; never prefixed

      WEAVE_ENABLE_TEAM: "${WEAVE_ENABLE_TEAM:-true}"
      WEAVE_ENABLE_QUADRUPLE: "${WEAVE_ENABLE_QUADRUPLE:-true}"
      WEAVE_ENABLE_MCP: "${WEAVE_ENABLE_MCP:-true}"

      # **The variable the bus refusal tells you to set** (W58). It advised
      # `export WEAVE_EVENT_BUS=postgres` and the bundle had no such variable, so
      # the advice changed nothing for the operator being addressed — W20's
      # mechanism, in a refusal rather than a description. Named here so the
      # instruction is actionable.
      WEAVE_EVENT_BUS: "${WEAVE_EVENT_BUS:-inprocess}"

      # A7: one worker, because this file defaults to the in-process event bus.
      # **The PostgreSQL LISTEN/NOTIFY adapter shipped in P3** — this comment used
      # to say it was still to come, which stopped being true and kept being read
      # (R6). What has not changed is the pairing: raising this line while the bus
      # above is `inprocess` would silently break SSE fan-out — a client on worker
      # 2 would never see an event published on worker 1, with no error and no
      # log. **Raise them together or not at all**; that pairing is A7, and it is
      # a tripwire, not a preference.
      WEAVE_WORKERS: "1"
    volumes:
      - weave-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    # `on-failure:3`, NOT `unless-stopped` (W19).
    #
    # The server refuses to start on a bad configuration — a shared signing
    # secret, an event bus that cannot fan out, quadruple mode on a backend with
    # no tables for it. **Those are deterministic: restarting cannot fix them.**
    # Under `unless-stopped` this container reprinted its banner and its refusal
    # twelve times in under a minute, until the one line explaining the problem
    # had scrolled out of reach.
    #
    # Three attempts still covers the transient case worth covering — the
    # database accepting connections a moment later than the server asked. After
    # that the container stays dead and readable, which is the only state in
    # which a configuration error is any use to anybody.
    #
    # The databases below keep `unless-stopped` on purpose: a database that dies
    # really can be worth restarting, and that is the whole distinction.
    restart: on-failure:3

  postgres:
    # **Built, not pulled** — because no published image can run the production
    # path (D-046, A4 v6). `PGGraphStorage` needs `age` *and* `vector` in one
    # database: `pgvector/pgvector:pg16`, which this line used to name, has no
    # `age` and dies at `create_graph`; `apache/age` has no `vector` and dies
    # earlier still, on connect. See `deploy/postgres.Dockerfile` for which half
    # we now maintain and why.
    #
    # The image built here provides both. That it *builds* proves nothing on its
    # own — the previous image built too. The gate is a graph round-trip on a
    # live server.
    build:
      context: ..
      dockerfile: deploy/postgres.Dockerfile
    image: weave-postgres:16
    environment:
      # The image's own variables. Not Weave's, so not prefixed.
      POSTGRES_USER: "${WEAVE_POSTGRES_USER:-weave}"
      POSTGRES_PASSWORD: "${WEAVE_POSTGRES_PASSWORD:?set WEAVE_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${WEAVE_POSTGRES_DATABASE:-weave}"
    volumes:
      - weave-postgres:/var/lib/postgresql/data
    healthcheck:
      # The server must not start before the database can answer, or the first
      # boot fails on a connection error that looks like a misconfiguration.
      test: ["CMD-SHELL", "pg_isready -U ${WEAVE_POSTGRES_USER:-weave} -d ${WEAVE_POSTGRES_DATABASE:-weave}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5
    environment:
      # **`:-` and not `:?`, and the difference is the whole of W56.**
      #
      # `profiles:` above keeps this service out of `up` unless it is asked for —
      # but compose interpolates **every** service's environment at parse time,
      # profile or not. With `:?` here, `docker compose up server postgres`
      # failed before starting anything, naming a service the operator never
      # asked for:
      #
      #   error while interpolating services.neo4j.environment.NEO4J_AUTH:
      #   required variable WEAVE_NEO4J_PASSWORD is missing a value
      #
      # **A profile makes a service optional to run, not optional to configure.**
      # So the PostgreSQL operator — the path A4 calls production — was blocked
      # at the front door by a credential for the experimental backend they had
      # deliberately not enabled.
      #
      # `:?` stays right for `WEAVE_TOKEN_SECRET` and `WEAVE_POSTGRES_PASSWORD`:
      # those are things **this** deployment cannot run without, and failing
      # loudly is the point. The rule the two cases share is *require what the
      # deployment uses, not what the file mentions* — and a placeholder here is
      # safe precisely because the service does not start without `--profile
      # neo4j`, at which point anyone actually using it will set a real one.
      NEO4J_AUTH: "neo4j/${WEAVE_NEO4J_PASSWORD:-neo4j-not-configured}"
    ports:
      - "0.0.0.0:7474:7474"
      - "0.0.0.0:7687:7687"
    volumes:
      - weave-neo4j:/data
    restart: unless-stopped
    # NOTE (R11): Community Edition cannot create a database per workspace —
    # multi-database is an Enterprise feature — so every workspace shares the
    # default database. Fine for one workspace, wrong for several. Verified at
    # M1; see tests/test_storage_paths.py.

volumes:
  weave-data:
  weave-postgres:
  weave-neo4j:
